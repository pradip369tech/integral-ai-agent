<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integral AI - Solution</title>
    <link rel="stylesheet" href="solution.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-card">
        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <div class="brand-pill">
                <div class="brand-icon">
                    <span class="integral-glyph">∫</span>
                </div>
                <span class="brand-text">Integral <span class="brand-highlight">AI</span></span>
            </div>

            <nav class="nav-tabs" aria-label="Main Navigation">
                <a href="solve.html" class="tab-btn">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span>Solve</span>
                </a>

                <a href="solution.html" class="tab-btn active" aria-current="page">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Solution</span>
                </a>

                <a href="simulate.html" class="tab-btn">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                        <line x1="7" y1="10" x2="10" y2="7"></line>
                        <line x1="10" y1="7" x2="14" y2="11"></line>
                        <line x1="14" y1="11" x2="17" y2="8"></line>
                    </svg>
                    <span>Simulation</span>
                </a>

                <a href="#" class="tab-btn">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Record</span>
                </a>
            </nav>
        </header>

        <!-- Main Two-Column Layout -->
        <main class="main-content">
            <!-- Left Solver Control Card -->
            <section class="solver-card">
                <h1 class="solver-title">
                    High-Precision<br>
                    Symbolic Solver
                </h1>

                <!-- Definite Toggle -->
                <div class="toggle-group">
                    <span class="toggle-label">Definite</span>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <!-- Integrand Input Section -->
                <div class="integrand-section">
                    <div class="integrand-header">
                        <span class="section-label">INTEGRAND INPUT</span>
                        <button type="button" class="scan-photo-btn">
                            <svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <span>Scan Photo</span>
                        </button>
                    </div>

                    <!-- Integral Expression Entry -->
                    <div class="integral-entry-row">
                        <div class="limits-stack">
                            <div class="limit-box upper-limit">π</div>
                            <div class="limit-box lower-limit">0</div>
                        </div>

                        <div class="integral-sign">∫</div>

                        <div class="expression-input-box">
                            <input 
                                type="text" 
                                class="expression-input" 
                                value="3x^2 · sin(x) + e^..." 
                                aria-label="Integrand expression" 
                                spellcheck="false"
                            >
                            <span class="dx-tag">dx</span>
                        </div>
                    </div>
                </div>

                <!-- Quick Insert Symbols -->
                <div class="quick-symbols-section">
                    <span class="symbols-title">QUICK INSERT SYMBOLS:</span>
                    <div class="symbols-grid">
                        <div class="symbols-row">
                            <button type="button" class="sym-btn">x<sup>2</sup></button>
                            <button type="button" class="sym-btn">√x</button>
                            <button type="button" class="sym-btn">e<sup>x</sup></button>
                            <button type="button" class="sym-btn">sin</button>
                            <button type="button" class="sym-btn">cos</button>
                            <button type="button" class="sym-btn">ln</button>
                        </div>
                        <div class="symbols-row">
                            <button type="button" class="sym-btn">a/b</button>
                            <button type="button" class="sym-btn">lim</button>
                        </div>
                    </div>
                </div>

                <!-- Bottom Actions -->
                <div class="action-footer">
                    <button type="button" class="btn-clear">
                        <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        <span>Clear</span>
                    </button>
                    <button type="button" class="btn-compute">
                        <span>Compute</span>
                        <span class="compute-arrow">→</span>
                    </button>
                </div>
            </section>

            <!-- Right Solution Workspace Card -->
            <section class="solution-workspace-card">
                <div class="dashed-solution-area"></div>
            </section>
        </main>
    </div>

</body>
</html>
