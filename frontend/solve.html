<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integral AI - High-Precision Symbolic Solver</title>
    <link rel="stylesheet" href="solve.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-card">
        <!-- Background Ambient Watermark -->
        <div class="watermark" aria-hidden="true">∫ f(x) dx</div>

        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <div class="brand-pill">
                <div class="brand-icon">
                    <span class="integral-glyph">∫</span>
                </div>
                <span class="brand-text">Integral <span class="brand-highlight">AI</span></span>
            </div>

            <nav class="nav-tabs" aria-label="Main Navigation">
                <a href="solve.html" class="tab-btn active" aria-current="page">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span>Solve</span>
                </a>

                <a href="solution.html" class="tab-btn">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Solution</span>
                </a>

                <a href="simulate.html" class="tab-btn">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                        <line x1="7" y1="10" x2="10" y2="7"></line>
                        <line x1="10" y1="7" x2="14" y2="11"></line>
                        <line x1="14" y1="11" x2="17" y2="8"></line>
                    </svg>
                    <span>Simulation</span>
                </a>

                <a href="#" class="tab-btn">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Record</span>
                </a>
            </nav>
        </header>

        <!-- Main Solver Content -->
        <main class="solver-content">
            <h1 class="main-title">High–Precision Symbolic Solver</h1>

            <!-- Expression Input Box -->
            <div class="input-card">
                <input 
                    type="text" 
                    class="math-input" 
                    value="∫ (3x^2 · sin(x) + e^(-2x)) dx" 
                    aria-label="Mathematical Expression" 
                    spellcheck="false"
                >
                <button type="button" class="compute-btn">
                    <span>Compute</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Quick Insert Symbols Section -->
            <div class="symbols-wrapper">
                <span class="symbols-label">QUICK INSERT SYMBOLS:</span>
                <div class="symbols-list">
                    <button type="button" class="sym-badge" aria-label="x squared">
                        <span class="badge-icon superscript-icon">x′</span>
                        <span class="badge-text">x<sup>2</sup></span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="square root of x">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <path d="M14 18l3-8 4 10"></path>
                        </svg>
                        <span class="badge-text">√x</span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="e to power of x">
                        <span class="badge-icon wave-icon">~</span>
                        <span class="badge-text">e<sup>x</sup></span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="sine">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
                        </svg>
                        <span class="badge-text">sin</span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="cosine">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <line x1="4" y1="7" x2="20" y2="7"></line>
                            <line x1="4" y1="12" x2="20" y2="12"></line>
                            <line x1="4" y1="17" x2="20" y2="17"></line>
                        </svg>
                        <span class="badge-text">cos</span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="natural logarithm">
                        <span class="badge-icon wave-icon">~</span>
                        <span class="badge-text">ln</span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="fraction a over b">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="12" y1="4" x2="12" y2="20"></line>
                            <line x1="6" y1="8" x2="9" y2="8"></line>
                            <line x1="15" y1="16" x2="18" y2="16"></line>
                        </svg>
                        <span class="badge-text">a/b</span>
                    </button>

                    <button type="button" class="sym-badge" aria-label="limit">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="12" x2="14" y2="12"></line>
                            <polyline points="10 8 14 12 10 16"></polyline>
                        </svg>
                        <span class="badge-text">lim</span>
                    </button>

                    <button type="button" class="sym-badge clear-btn" onclick="document.querySelector('.math-input').value=''; document.querySelector('.math-input').focus();" aria-label="Clear expression">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                        <span class="badge-text">Clear</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
